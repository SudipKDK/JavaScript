<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple To-Do List</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  
</head>
<body class="bg-light p-4">
  <div class="todo-container container-sm bg-white rounded shadow p-5 my-5 mx-auto">
    <h2 class="text-center mb-5 pb-3">
      <i class="bi bi-check2-square"></i> To-Do List
    </h2>
    <div class="input-group mb-4">
      <input type="text" class="form-control" id="new-todo" placeholder="Enter a task..." aria-label="Enter a task">
      <button class="btn btn-primary" type="button" id="addBtn" onclick="newNote()">
        <i class="bi bi-plus-circle"></i> Add
      </button>
    </div>
    <ul id="list" class="list-unstyled mt-4">
    </ul>
  </div>

  <script src="main.js"></script>
</body>
</html>
